<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>التبليغات | Medixa</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <meta name="theme-color" content="#13294B">
  <link rel="stylesheet" href="css/style.css?v=step55">
  <link rel="stylesheet" href="css/upload.css?v=step55">
  <script>
    try { var t = localStorage.getItem("ms.theme"); if (t) document.documentElement.setAttribute("data-theme", JSON.parse(t)); } catch (e) {}
  </script>
</head>
<body>
  <header class="up-top">
    <div class="container up-top-in">
      <a class="brand" href="index.html"><span>Medixa</span></a>
      <a class="btn btn-secondary btn-sm" href="login.html">حسابي</a>
    </div>
  </header>
  <main class="container up-main" id="main">
    <h1 class="up-title">التبليغات</h1>
    <p class="up-lead">هذه الصفحة لممثل الدفعة والمشرفين. ما تكتبه هنا يظهر لكل الطلاب في الصفحة الرئيسية.</p>
    <p class="up-msg" id="msg" role="alert" hidden></p>

    <section class="card up-card" aria-label="تبليغ جديد" id="formCard" hidden>
      <h2 class="up-sub">تبليغ جديد</h2>
      <form class="up-form" id="form" autocomplete="off" novalidate>
        <div>
          <label class="up-label" for="title">العنوان</label>
          <input class="field" id="title" type="text" maxlength="120" required>
        </div>
        <div>
          <label class="up-label" for="body">النص (اختياري)</label>
          <textarea class="field" id="body" rows="5" maxlength="2000"></textarea>
        </div>
        <div class="up-actions"><button class="btn btn-primary" type="submit" id="send">نشر التبليغ</button></div>
      </form>
    </section>

    <section class="card up-card" aria-label="التبليغات المنشورة" id="listCard" hidden>
      <h2 class="up-sub">المنشورة الآن</h2>
      <div id="list"></div>
    </section>
  </main>
  <script src="js/auth.js?v=step55"></script>
  <script src="js/announce.js?v=step55"></script>
</body>
</html>
