  <script>
    try { var t = localStorage.getItem("ms.theme"); if (t) document.documentElement.setAttribute("data-theme", JSON.parse(t)); } catch (e) {}
    try { var l = JSON.parse(localStorage.getItem("ms.lang")); if (l === "en" || l === "fa") { document.documentElement.lang = l; document.documentElement.dir = l === "en" ? "ltr" : "rtl"; } } catch (e) {}
    try { if (JSON.parse(localStorage.getItem("ms.nav")) === "min") document.documentElement.classList.add("nav-min"); } catch (e) {}

  <main class="container chat" id="content">

    <div class="chat-shell">

      <div class="chat-log" id="log" aria-live="polite"></div>
      <div class="chat-pending" id="pending" hidden></div>
      <form class="chat-form" id="form" autocomplete="off" hidden>
        <button class="chat-attach" type="button" id="attachBtn" aria-label="إرفاق" aria-haspopup="dialog"></button>
        <label class="visually-hidden" for="msg">اكتب رسالتك</label>
        <textarea class="field chat-input" id="msg" rows="1" maxlength="1000" placeholder="اكتب رسالتك"></textarea>
        <button class="chat-send" type="submit" id="send" aria-label="إرسال"></button>
      </form>
    </div>
  </main>
