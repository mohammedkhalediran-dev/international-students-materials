(async()=>{const params=new URLSearchParams(location.search),src=params.get('file');const status=document.getElementById('status'),root=document.getElementById('pages'),error=document.getElementById('error');if(!src){error.textContent='لم يتم تحديد ملف PDF';return}const failView=(message)=>{/* Step 43: explain and offer recovery instead of a dead end */error.textContent='';const p=document.createElement('p');p.textContent=message;error.append(p);let u=null;try{u=new URL(src,location.href)}catch{}if(u&&u.origin===location.origin&&/^https?:$/.test(u.protocol)){const a=document.createElement('a');a.href=u.href;a.target='_blank';a.rel='noopener';a.className='mx-fail-open';a.textContent='افتح الملف مباشرة';error.append(a,' ')}const r=document.createElement('button');r.type='button';r.className='mx-fail-retry';r.textContent='أعد المحاولة';r.onclick=()=>location.reload();error.append(r);status.textContent='تعذر عرض الملف هنا'};const rasterKey=(()=>{try{return decodeURIComponent(new URL(src,location.href).pathname).replace(/^\//,'')}catch{return ''}})(),rasterOnly=!window.pdfjsLib&&!!window.medixaRasterManifest?.[rasterKey]?.length;if(!window.pdfjsLib&&!rasterOnly){failView('تعذر تحميل مكتبة عرض PDF (قد تكون الشبكة تحجبها). افتح الملف مباشرة أو أعد المحاولة لاحقاً.');return}if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';let tool='pen',color='#e43d56',width=3,doc,bytes,items=[],history=[];const key='medixa.pdf.annotations.v1:'+new URL(src,location.href).href;const inkGuard=MedixaGuard.open(localStorage,key,{fallback:()=>[],valid:Array.isArray});items=inkGuard.value;const save=()=>{status.textContent=MedixaGuard.MSG[inkGuard.write(items)]};document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b))});document.getElementById('color').oninput=e=>color=e.target.value;document.getElementById('width').oninput=e=>width=+e.target.value;document.getElementById('undo').onclick=()=>{if(!history.length)return;const last=history.pop();items=last;drawAll();save()};function paint(ctx,s,w,h){if(!s.points?.length)return;ctx.save();ctx.globalAlpha=s.tool==='highlight'?.28:1;ctx.strokeStyle=s.color;ctx.lineWidth=s.width*w/800*(s.tool==='highlight'?6:1);ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();if(['line','rectangle','ellipse'].includes(s.tool)&&s.points.length>1){const a=s.points[0],b=s.points[s.points.length-1],x=a[0]*w,y=a[1]*h,dx=(b[0]-a[0])*w,dy=(b[1]-a[1])*h;if(s.tool==='line'){ctx.moveTo(x,y);ctx.lineTo(x+dx,y+dy)}else if(s.tool==='rectangle'){ctx.strokeRect(x,y,dx,dy)}else{ctx.ellipse(x+dx/2,y+dy/2,Math.max(.1,Math.abs(dx)/2),Math.max(.1,Math.abs(dy)/2),0,0,2*Math.PI)}ctx.stroke();ctx.restore();return} s.points.forEach((p,i)=>{const x=p[0]*w,y=p[1]*h;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});if(s.points.length===1){ctx.lineTo(s.points[0][0]*w+.01,s.points[0][1]*h+.01)}ctx.stroke();ctx.restore()}function drawAll(){document.querySelectorAll('canvas.ink').forEach(c=>{const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);items.filter(x=>x.page===+c.dataset.page).forEach(s=>paint(ctx,s,c.width,c.height))})}function setup(c,page){let current=null;const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};c.addEventListener('pointerdown',e=>{e.preventDefault();c.setPointerCapture(e.pointerId);history.push(JSON.parse(JSON.stringify(items)));if(history.length>40)history.shift();const p=pos(e);if(tool==='lasso'){const hit=items.map((s,i)=>({s,i})).filter(o=>o.s.page===page).reverse().find(o=>o.s.points?.some(q=>Math.hypot(q[0]-p[0],q[1]-p[1])<.055));if(hit){window.medixaLassoSelection={page,index:hit.i,stroke:hit.s};window.dispatchEvent(new CustomEvent('medixa-lasso-selected',{detail:{page,index:hit.i}}));}else{window.medixaLassoSelection=null;window.dispatchEvent(new Event('medixa-lasso-c max(.4,(Math.min(innerWidth-24,960))/base.width)),v=p.getViewport({scale});const wrap=document.createElement('section');wrap.className='page';const pdf=document.createElement('canvas');pdf.className='pdf';pdf.width=Math.round(v.width);pdf.height=Math.round(v.height);const ink=document.createElement('canvas');ink.className='ink';ink.width=pdf.width;ink.height=pdf.height;ink.dataset.page=i;wrap.append(pdf,ink);const label=document.createElement('span');label.className='page-label';label.textContent=i+' / '+doc.numPages;wrap.append(label);root.append(wrap);const pathKey=decodeURIComponent(new URL(src,location.href).pathname).replace(/^\//,'');

if(tab==='map'){html='<h3>خريطة مفاهيمية جديدة</h3><input id="map-title" placeholder="عنوان الخريطة"><textarea id="map-body" placeholder="كل سطر يمثل عقدة. استخدم → للربط بين المفاهيم"></textarea>'+pageSelect()+'<button id="add-map" class="study-action">حفظ الخريطة</button>'+data.maps.map(m=>'<div class="study-item"><b>'+esc(m.title)+'</b><pre style="white-space:pre-wrap">'+esc(m.body)+'</pre><button data-go="'+m.page+'">المصدر</button><button data-delete="maps:'+esc(m.id)+'">حذف</button></div>').join('')}
if(tab==='backup'){html='<h3>النسخ الاحتياطي</h3><p>نزّل بيانات أدوات الدراسة أو استعدها عند تغيير الجهاز. النسخ الاحتياطي لا يشمل رسومات القلم؛ تُحفظ منفصلة.</p><button id="study-export" class="study-action">تنزيل بيانات الدراسة JSON</button><label>استعادة ملف سابق<input id="study-import" type="file" accept="application/json,.json"></label><p class="muted">الاستعادة تدمج العناصر حسب معرفاتها، دون حذف العناصر الحالية.</p>'}
if(tab==='quiz'){html='<h3>سؤال اختيار من متعدد</h3><textarea id="quiz-q" placeholder="السؤال"></textarea>'+['A','B','C','D'].map(x=>'<input id="quiz-'+x+'" placeholder="الخيار '+x+'">').join('')+'<select id="quiz-correct"><option value="0">الإجابة A</option><option value="1">الإجابة B</option><option value="2">الإجابة C</option><option value="3">الإجابة D</option></select>'+pageSelect()+'<button id="add-quiz" class="study-action">حفظ السؤال</button><h3>اختبر نفسك ('+data.quiz.length+')</h3>'+data.quiz.map(q=>'<div class="study-item"><b>'+esc(q.question)+'</b><small> — صفحة '+q.page+'</small>'+q.options.map((o,i)=>'<div><button data-answer="'+esc(q.id)+':'+i+'">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button></div>').join('')+'<div id="feedback-'+esc(q.id)+'"></div><button data-go="'+q.page+'">المصدر</button><button data-delete="quiz:'+esc(q.id)+'">حذف</button></div>').join('')}
content.innerHTML=html}
function pageInput(){const p=Number(value('study-page'));if(!Number.isInteger(p)||p<1||p>Math.max(1,pageCount())){alert('رقم الصفحة غير صالح');return null}return p}
document.getElementById('study-launch').onclick=()=>{panel.classList.add('open');render()};document.getElementById('study-close').onclick=()=>panel.classList.remove('open');
panel.querySelectorAll('[data-study-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.studyTab;render()});
content.onclick=e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.go){goto(Number(b.dataset.go));return}
if(b.dataset.delete){const [type,itemId]=b.dataset.delete.split(':');if(!confirm('حذف العنصر؟'))return;data[type]=data[type].filter(x=>x.id!==itemId);save();renderMasks();render();return}
if(b.dataset.reveal){showAnswer[b.dataset.reveal]=!showAnswer[b.dataset.reveal];render();return}
if(b.dataset.grade){const [cid,grade]=b.dataset.grade.split(':'),c=data.cards.find(x=>x.id===cid);if(!c)return;Object.assign(c,anki.grade(c,grade,Date.now()));delete showAnswer[cid];save();render();return}

if(b.id==='add-map'){const title=value('map-title'),body=value('map-body'),page=pageInput();if(!title||!body||!page)return alert('أكمل الخريطة');data.maps.push({id:id(),title,body,page});save();render();return}
if(b.id==='study-export'){const blob=new Blob([JSON.stringify({format:'medixa-study-v2',document:new URL(src,location.href).href,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='medixa-study-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);return}
if(b.dataset.answer){const [qid,ans]=b.dataset.answer.split(':');const q=data.quiz.find(x=>x.id===qid),out=document.getElementById('feedback-'+qid);if(q&&out)out.textContent=Number(ans)===q.correct?'✓ إجابة صحيحة':'✗ الإجابة الصحيحة: '+String.fromCharCode(65+q.correct);return}
if(b.id==='mask-toggle'){maskMode=!maskMode;document.body.classList.toggle('study-mask-mode',maskMode);panel.classList.remove('open');render();return}
if(b.id==='mask-hide-all'){data.masks.forEach(m=>m.revealed=false);save();renderMasks();return}
if(b.id==='add-card'){const question=value('card-question'),answer=value('card-answer'),page=pageInput();if(!question||!answer||!page)return alert('أدخل السؤال والإجابة والصفحة');data.cards.push({id:id(),question,answer,page});save();render()}
if(b.id==='add-note'){const body=value('note-body'),page=pageInput();if(!body||!page)return alert('أدخل الملاحظة والصفحة');data.notes.push({id:id(),body,page});save();render()}
if(b.id==='add-quiz'){const question=value('quiz-q'),options=['A','B','C','D'].map(x=>value('quiz-'+x)),page=pageInput();if(!question||options.some(x=>!x)||!page)return alert('أكمل السؤال والخيارات ورقم الصفحة');data.quiz.push({id:id(),question,options,correct:Number(value('quiz-correct')),page});save();render()}
};
content.addEventListener('change',async e=>{if(e.target.id!=='study-import')return;const file=e.target.files?.[0];if(!file)return;try{if(file.size>5_000_000)throw Error('ملف كبير جداً');const payload=JSON.parse(await file.text());if(payload.format!=='medixa-study-v2'||!payload.data||typeof payload.data!=='object')throw Error('صيغة غير مدعومة');if(payload.document!==new URL(src,location.href).href&&!confirm('النسخة من ملف PDF مختلف. هل تريد دمجها؟'))return;for(const k of Object.keys(empty())){const incoming=payload.data[k];if(!Array.isArray(incoming))continue;const known=new Set(data[k].map(x=>x.id));for(const x of incoming){if(!x||typeof x!=='object'||typeof x.id!=='string'||known.has(x.id))continue;data[k].push(x);known.add(x.id)}}save();renderMasks();render();alert('تم استيراد البيانات')}catch(err){alert('تعذر الاستيراد: '+err.message)}});
const root=document.getElementById('pages');root.addEventListener('pointerdown',e=>{if(!maskMode)return;const parent=e.target.closest('.page');if(!parent||e.target.closest('.study-mask'))return;const rect=parent.getBoundingClientRect();drag={parent,page:[...root.querySelectorAll('.page')].indexOf(parent)+1,x:(e.clientX-rect.left)/rect.width,y:(e.clientY-rect.top)/rect.height};e.preventDefault()},true);
root.addEventListener('pointerup',e=>{if(!drag)return;const rect=drag.parent.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width,y=(e.clientY-rect.top)/rect.height;const m={id:id(),page:drag.page,x:Math.max(0,Math.min(drag.x,x)),y:Math.max(0,Math.min(drag.y,y)),w:Math.abs(x-drag.x),h:Math.abs(y-drag.y),revealed:false};drag=null;if(m.w<.01||m.h<.01)return;data.masks.push(m);save();renderMasks()},true);
const observer=new MutationObserver(()=>{if(root.querySelector('.page')&&root.querySelectorAll('.study-mask').length!==data.masks.filter(m=>m.page<=pageCount()).length)renderMasks()});observer.observe(root,{childList:true,subtree:false});renderMasks();
})();
</script><style id="medixa-enhanced-style">#study-panel{width:min(470px,100vw)}#study-summary{background:#eaf6f5;padding:12px;border-radius:12px;margin:10px 0}#study-summary .numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}#study-summary .numbers span{background:white;text-align:center;border-radius:8px;padding:8px;font-size:12px}#study-summary b{display:block;font-size:21px;color:#125c62}#study-filter{width:100%;padding:10px;border:1px solid #bbd3d5;border-radius:9px;margin:8px 0}.medixa-concept-preview{border:1px solid #cee1e3;border-radius:10px;overflow:auto;margin:8px 0}.medixa-concept-preview svg{width:100%;min-width:300px}.medixa-concept-preview text{font-family:system-ui;font-size:11px;fill:#193f4b}.medixa-concept-preview line{stroke:#79a9af;stroke-width:2}.medixa-concept-preview rect{fill:#e1f3ef;stroke:#8cbcc0}#study-panel button:focus-visible{outline:3px solid #167c84}</style><script defer src="./js/study-enhancements.js"></script><link rel="stylesheet" href="./css/study-mode-v5.css"><script defer src="./js/study-mode-v5.js"></script><link rel="stylesheet" href="./css/study-mode-v6.css"><script defer src="./js/study-mode-v6.js"></script><script defer src="./js/study-mode-v82.js"></script><script defer src="./js/study-timer-v83.js"></script><script defer src="./js/study-planner-v84.js?v=step42"></script><link rel="stylesheet" href="./css/study-suite-v85.css"><script defer src="./js/study-suite-v85.js?v=step52"></script><script defer src="./js/study-workspace-v86.js?v=step42"></script><script defer src="./js/study-backup-v87.js?v=step40"></script><script defer src="./js/study-recovery-v88.js"></script><script defer src="./js/study-ink-backup-v89.js"></script><script defer src="./js/study-recovery-diagnostics.js"></script><script defer src="./js/study-occlusion-v90.js?v=step52"></script><script defer src="./js/study-text-cards-v92.js?v=step46"></script><script defer src="./js/study-dock-v91.js?v=step52"></script></body></html>
