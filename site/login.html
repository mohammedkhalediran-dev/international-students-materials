<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>تسجيل الدخول | Medixa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#13294B">
  <link rel="stylesheet" href="css/style.css?v=p3-15">
  <link rel="stylesheet" href="css/upload.css?v=p3-15">
  <script>
    try { var t = localStorage.getItem("ms.theme"); if (t) document.documentElement.setAttribute("data-theme", JSON.parse(t)); } catch (e) {}
    try { var l = JSON.parse(localStorage.getItem("ms.lang")); if (l === "en" || l === "fa") { document.documentElement.lang = l; document.documentElement.dir = l === "en" ? "ltr" : "rtl"; } } catch (e) {}
  </script>
</head>
<body>
  <noscript>
    <p class="load-error">هذه الصفحة تحتاج إلى تفعيل JavaScript.</p>
  </noscript>

  <header class="up-top">
    <div class="container up-top-in">
      <a class="brand" href="index.html">
        <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path stroke-width="2.4" d="M6 24V8l10 10L26 8v16"/><path stroke-width="2" d="M13.5 24h5M16 21.5v5"/></g></svg>
        <span>Medixa</span>
      </a>
      <a class="btn btn-secondary btn-sm" href="index.html">العودة إلى الموقع</a>
    </div>
  </header>

  <main class="container lg-main" id="main">
    <section class="card lg-card" id="formCard">
      <h1 class="lg-title" id="pageTitle">أهلاً بك في <span data-site-title>Medixa</span></h1>
      <p class="lg-lead">سجّل دخولك لتحفظ مفضلتك وتقدمك على أي جهاز، أو تصفّح الموقع كزائر.</p>

      <div class="lg-actions">
        <button class="btn lg-google" type="button" id="googleBtn">
          <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
          <span>الدخول بحساب Google</span>
        </button>
        <p class="lg-or" aria-hidden="true"><span>أو</span></p>
        <a class="btn btn-secondary lg-guest" id="guestBtn" href="index.html">المتابعة كزائر</a>
      </div>

      <p class="up-msg" id="msg" role="alert" hidden></p>
      <p class="lg-note">الزائر يرى كل المواد، لكن مفضلته وتقدمه يبقيان على هذا الجهاز فقط.</p>
    </section>

    <section class="card lg-card" id="doneCard" hidden>
      <h1 class="lg-title">حسابي</h1>
      <p class="lg-lead"><span>أنت مسجّل الدخول باسم</span> <strong id="who" data-i18n-skip></strong></p>
      <div class="lg-actions">
        <a class="btn btn-primary" id="goNext" href="index.html">متابعة إلى الموقع</a>
        <a class="btn btn-secondary" id="adminLink" href="admin.html" hidden>إدارة الحسابات</a>
        <button class="btn btn-secondary" type="button" id="logout">خروج</button>
      </div>
    </section>
  </main>

  <script src="js/i18n.js?v=p3-15"></script>
  <script src="js/auth.js?v=p3-15"></script>
  <script src="js/login.js?v=p3-15"></script>
  <script>if (window.I18N) I18N.apply();</script>
</body>
</html>
