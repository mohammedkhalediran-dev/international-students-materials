<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>تسجيل الدخول | Medixa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#13294B">
  <link rel="stylesheet" href="css/style.css?v=p3-15">
  <link rel="stylesheet" href="css/upload.css?v=p3-15">
  <script>
    try { var t = localStorage.getItem("ms.theme"); if (t) document.documentElement.setAttribute("data-theme", JSON.parse(t)); } catch (e) {}
    try { var l = JSON.parse(localStorage.getItem("ms.lang")); if (l === "en" || l === "fa") { document.documentElement.lang = l; document.documentElement.dir = l === "en" ? "ltr" : "rtl"; } } catch (e) {}
  </script>
</head>
<body>
  <noscript>
    <p class="load-error">هذه الصفحة تحتاج إلى تفعيل JavaScript.</p>
  </noscript>

  <header class="up-top">
    <div class="container up-top-in">
      <a class="brand" href="index.html">
        <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path stroke-width="2.4" d="M6 24V8l10 10L26 8v16"/><path stroke-width="2" d="M13.5 24h5M16 21.5v5"/></g></svg>
        <span>Medixa</span>
      </a>
      <a class="btn btn-secondary btn-sm" href="index.html">العودة إلى الموقع</a>
    </div>
  </header>

  <main class="container up-main" id="main">
    <h1 class="up-title" id="pageTitle">تسجيل الدخول</h1>
    <p class="up-lead">حسابك يحفظ مفضلتك وتقدمك وتاريخ الامتحان، فتجدها على أي جهاز.</p>

    <section class="card up-card" id="formCard">
      <div class="up-actions" role="group" aria-label="نوع العملية">
        <button class="btn btn-primary btn-sm" type="button" id="tabLogin" aria-pressed="true">تسجيل الدخول</button>
        <button class="btn btn-secondary btn-sm" type="button" id="tabRegister" aria-pressed="false">إنشاء حساب</button>
      </div>
      <form class="up-form" id="form" novalidate>
        <div id="nameRow" hidden>
          <label class="up-label" for="name">اسمك</label>
          <input class="field" id="name" type="text" maxlength="60" autocomplete="name">
        </div>
        <div>
          <label class="up-label" for="email">البريد الإلكتروني</label>
          <input class="field up-ltr" id="email" type="email" autocomplete="email" inputmode="email" required>
        </div>
        <div>
          <label class="up-label" for="password">كلمة المرور</label>
          <input class="field up-ltr" id="password" type="password" autocomplete="current-password" minlength="8" required>
          <p class="up-hint" id="pwHint" hidden>8 أحرف على الأقل.</p>
        </div>
        <div id="codeRow" hidden>
          <label class="up-label" for="code">رمز الدعوة (إن طُلب)</label>
          <input class="field up-ltr" id="code" type="text" autocomplete="off">
        </div>
        <p class="up-msg" id="msg" role="alert" hidden></p>
        <div class="up-actions">
          <button class="btn btn-primary" type="submit" id="submit">دخول</button>
        </div>
      </form>
    </section>

    <section class="card up-card" id="doneCard" hidden>
      <p class="up-who"><span><span>أنت مسجّل الدخول باسم</span> <strong id="who" data-i18n-skip></strong></span></p>
      <div class="up-actions">
        <a class="btn btn-primary" id="goNext" href="index.html">متابعة إلى الموقع</a>
        <a class="btn btn-secondary" id="adminLink" href="admin.html" hidden>إدارة الحسابات</a>
        <button class="btn btn-secondary" type="button" id="logout">خروج</button>
      </div>
    </section>
  </main>

  <script src="js/i18n.js?v=p3-15"></script>
  <script src="js/auth.js?v=p3-15"></script>
  <script src="js/login.js?v=p3-15"></script>
  <script>if (window.I18N) I18N.apply();</script>
</body>
</html>
