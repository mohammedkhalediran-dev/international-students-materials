        <span class="banner-tag en" dir="ltr">MEDICAL LEARNING</span>
        <p class="banner-title"><span>معرفة أعمق.</span> <span>دراسة أذكى.</span></p>

        </a>

        <p id="footNotice" hidden></p>
      </div>
      <nav class="footer-links" aria-label="روابط التذييل">
        <a href="index.html#semesters">المواد</a>
        <a href="index.html#latest">المحاضرات</a>
        <a href="index.html#professors">الأساتذة</a>
        <a href="index.html#tools">أدوات الطالب</a>

    </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data/courses.js?v=step67"></script>
  <script src="api/uploads.js"></script>
  <script src="js/i18n.js?v=ex91"></script>
  <script src="js/app.js?v=side66"></script><script src="js/auth.js?v=plan66"></script>
  <script src="js/nav.js?v=off92"></script><script src="js/motion.js?v=mv82"></script><script src="js/my-course.js?v=step58"></script>
  <script>
    (function () {
      var $ = MS.$, el = MS.el;
      if (MS.dataError()) return;
      MS.initShared();
      MS.initHeader();


      var id = parseInt(new URLSearchParams(location.search).get("id"), 10);
      var sem = SEMESTERS.filter(function (s) { return s.id === id; })[0];
      var root = $("content");
      if (!sem) {
        var miss = el("div", "empty");
        miss.appendChild(el("strong", "", "الرابط غير صحيح أو أن الكورس غير موجود"));
        miss.appendChild(el("p", "", "ارجع إلى الرئيسية واختر الكورس."));
        root.appendChild(miss);
        return;
      }

      document.title = sem.name + " | " + SITE.title;
      $("crumbCurrent").textContent = sem.name;
      var list = COURSES.filter(function (c) { return c.semester === sem.id; });
      $("semName").textContent = sem.name;

      if (!list.length) {
        var empty = el("div", "empty");
        empty.appendChild(el("strong", "", "لم تُضف مواد هذا الكورس بعد."));
        root.appendChild(empty);
        return;
      }
      // العنوان + أزرار التصفية حسب النوع (الكل / العلوم الطبية الأساسية / المواد العامة)
      var bar = el("div", "sem-filter");
      var head0 = el("div", "sem-filter-head");
      head0.appendChild(el("h2", "", "المواد الدراسية"));
      head0.appendChild(el("span", "group-count", MS.subjectsLabel(list.length)));
      bar.appendChild(head0);
      var chips = el("div", "chips");
      chips.setAttribute("role", "group");
      chips.setAttribute("aria-label", "تصفية المواد");
      bar.appendChild(chips);
      root.appendChild(bar);

      var groups = [];
      function chip(label, n, catId) {
        var b = el("button", "chip");
        b.type = "button";
        b.appendChild(el("span", "", label));
        b.appendChild(el("small", "", String(n)));
        b.addEventListener("click", function () {
          [].forEach.call(chips.children, function (x) { x.classList.toggle("is-on", x === b); x.setAttribute("aria-pressed", String(x === b)); });
          groups.forEach(function (g) { g.sec.hidden = !!catId && g.id !== catId; });
        });
        chips.appendChild(b);
        return b;
      }
      chip("الكل", list.length, null);
      CATEGORIES.forEach(function (cat) {
        var items = list.filter(function (c) { return c.category === cat.id; });
        if (!items.length) return;
        chip(cat.name, items.length, cat.id);
        var sec = el("section", "group");
        var head = el("div", "group-head");
        head.appendChild(el("h3", "group-title", cat.name));
        head.appendChild(el("span", "group-count", MS.subjectsLabel(items.length)));
        sec.appendChild(head);
        var grid = el("div", "course-grid");
        items.forEach(function (c) { grid.appendChild(MS.courseCard(c)); });
        sec.appendChild(grid);
        root.appendChild(sec);
        groups.push({ id: cat.id, sec: sec });
      });
      chips.firstChild.classList.add("is-on");
      [].forEach.call(chips.children, function (x, i) { x.setAttribute("aria-pressed", String(i === 0)); });
    })();
  </script>
  <script>if (window.I18N) I18N.apply();</script>
