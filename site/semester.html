    try { var t = localStorage.getItem("ms.theme"); if (t) document.documentElement.setAttribute("data-theme", JSON.parse(t)); } catch (e) {}

<body>
  <noscript>
    <p class="load-error">هذا الموقع يحتاج إلى تفعيل JavaScript لعرض المواد. <span lang="fa">برای نمایش دروس، JavaScript را فعال کنید.</span> <span lang="en" dir="ltr">Please enable JavaScript to see the subjects.</span></p>
  </noscript>
  <a class="skip" href="#content">تخطَّ إلى المحتوى</a>

  <div class="notice" id="notice" hidden></div>

  <!-- ===== القائمة الجانبية والرأس (نفسهما في كل الصفحات) ===== -->

    <a class="brand" href="index.html">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="7" width="18" height="18"/><rect x="7" y="7" width="18" height="18" transform="rotate(45 16 16)"/></g></svg>
      <span data-site-title></span>
    </a>
    <nav class="nav" id="nav" aria-label="التنقل الرئيسي">
        <a href="index.html#home" data-ico="home"><span>الرئيسية</span></a>
        <a href="index.html#semesters" data-ico="grid"><span>المواد</span></a>
        <a href="index.html#latest" data-ico="file"><span>المحاضرات</span></a>
        <a href="index.html#professors" data-ico="users"><span>الأساتذة</span></a>
        <a href="index.html#favorites" data-ico="star"><span>المفضلة</span></a>
        <a href="index.html#tools" data-ico="tools"><span>أدوات الطالب</span></a>
        <span class="nav-soon" data-ico="help" aria-disabled="true"><span>بنك الأسئلة</span><span class="badge badge-soon">قريباً</span></span>
        <span class="nav-soon" data-ico="calendar" aria-disabled="true"><span>التقويم الأكاديمي</span><span class="badge badge-soon">قريباً</span></span>
    </nav>
  </aside>
  <div class="scrim" id="scrim"></div>

  <header class="site-header">
    <div class="container header-inner">
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="القائمة" aria-expanded="false" aria-controls="sidebar"></button>
      <button class="search-pill" id="searchBtn" type="button" aria-label="بحث"><span>ابحث عن مادة أو أستاذ أو محاضرة</span></button>
      <div class="header-actions">
        <a class="icon-btn" id="favLink" href="index.html#favorites" aria-label="المفضلة"></a>
        <select class="lang-sel" id="langSel" aria-label="اللغة" data-i18n-skip>
          <option value="ar" lang="ar">عربي</option>
          <option value="fa" lang="fa">فارسی</option>
          <option value="en" lang="en">English</option>
        </select>
        <button class="icon-btn" id="themeBtn" type="button"></button>
      </div>
    </div>
  </header>

  <!-- رأس الصفحة: مسار التنقل + اسم الكورس -->
  <section class="page-hero band">
    <nav class="breadcrumb" aria-label="مسار التنقل">
      <ol>
        <li><a href="index.html">الرئيسية</a></li>
        <li><span aria-current="page" id="crumbCurrent">الكورس</span></li>
      </ol>
    </nav>
    <div class="c-body">
      <h1 class="course-title" id="semTitle"></h1>
      <p class="course-title-ar" id="semCount"></p>
    </div>
  </section>

  <main class="container" id="content"></main>

  <footer class="footer">
    <div class="container footer-inner">
      <div>
        <a class="brand" href="index.html">
          <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="7" width="18" height="18"/><rect x="7" y="7" width="18" height="18" transform="rotate(45 16 16)"/></g></svg>
          <span data-site-title></span>
        </a>
        <p class="foot-uni" id="footUni" hidden></p>
        <p id="footNotice" hidden></p>
      </div>
      <nav class="footer-links" aria-label="روابط التذييل">
        <a href="index.html#semesters">المواد</a>
        <a href="index.html#latest">المحاضرات</a>
        <a href="index.html#professors">الأساتذة</a>
        <a href="index.html#tools">أدوات الطالب</a>
        <a href="index.html#faq">الأسئلة الشائعة</a>
      </nav>
    </div>
    <div class="container footer-bottom" id="footBottom"></div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data/courses.js?v=p3-12"></script>
  <script src="api/uploads.js"></script>
  <script src="js/i18n.js?v=p3-12"></script>
  <script src="js/app.js?v=p3-12"></script>
  <script>
    (function () {
      var $ = MS.$, el = MS.el;
      if (MS.dataError()) return;
      MS.initShared();
      MS.initHeader();

      var id = parseInt(new URLSearchParams(location.search).get("id"), 10);
      var sem = SEMESTERS.filter(function (s) { return s.id === id; })[0];
      var root = $("content");
      if (!sem) {
        var miss = el("div", "empty");
        miss.appendChild(el("strong", "", "الرابط غير صحيح أو أن الكورس غير موجود"));
        miss.appendChild(el("p", "", "ارجع إلى الرئيسية واختر الكورس."));
        root.appendChild(miss);
        return;
      }

      document.title = sem.name + " | " + SITE.title;
      $("crumbCurrent").textContent = sem.name;
      $("semTitle").textContent = sem.name;
      var list = COURSES.filter(function (c) { return c.semester === sem.id; });
      $("semCount").textContent = list.length ? MS.subjectsLabel(list.length) : "قريباً";

      if (!list.length) {
        var empty = el("div", "empty");
        empty.appendChild(el("strong", "", "لم تُضف مواد هذا الكورس بعد."));
        root.appendChild(empty);
        return;
      }
      CATEGORIES.forEach(function (cat) {
        var items = list.filter(function (c) { return c.category === cat.id; });
        if (!items.length) return;
        var sec = el("section", "group");
        var head = el("div", "group-head");
        head.appendChild(el("h2", "group-title", cat.name));
        head.appendChild(el("span", "group-count", MS.subjectsLabel(items.length)));
        sec.appendChild(head);
        var grid = el("div", "course-grid");
        items.forEach(function (c) { grid.appendChild(MS.courseCard(c)); });
        sec.appendChild(grid);
        root.appendChild(sec);
      });
    })();
  </script>
</body>
</html>
